name: Portable bundles

# Offline install: one self-contained bundle per platform, each packed on that
# platform because node_modules holds native binaries (node-pty's prebuilds, next's
# matching SWC). Each bundle also carries a Node.js runtime and a launcher, so the
# machine it is copied to needs nothing installed.
#
# Pushing a `v*` tag builds the four bundles and attaches them to that tag's
# release. Running this workflow by hand rebuilds them as artifacts for any ref.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to pack
        default: main
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            os: windows-latest
          - target: mac-arm64
            os: macos-14
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm ci
      - run: npm run build
      # node_modules is installed for this platform, the runtime is downloaded from
      # nodejs.org and checksum-verified, and everything is archived together.
      - name: Pack ${{ matrix.target }}
        run: node scripts/make-portable.mjs --target ${{ matrix.target }}
      - name: Check the bundle runs on its own
        timeout-minutes: 10
        run: node scripts/test-portable.mjs --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: pi-web-remote-${{ matrix.target }}
          path: |
            dist/portable/pi-web-remote-*-${{ matrix.target }}.tar.gz
            dist/portable/pi-web-remote-*-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-web-remote-*
          path: bundles
          merge-multiple: true
      - name: Attach the bundles to this tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "pi-web-remote $TAG" --verify-tag
          gh release upload "$TAG" bundles/pi-web-remote-* --clobber
          gh release view "$TAG"
