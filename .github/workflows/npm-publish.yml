name: npm publish

# Online install (`npm install -g @hzrshz/pi-web-remote`, `npx …`) needs this
# package on the registry; the portable bundles in portable.yml cover offline use.
#
# One tag is one release: pushing v<version> publishes to npm here and attaches the
# four platform bundles to that tag's GitHub Release over in portable.yml.
#
# No npm token is stored in this repository. The job asks GitHub for an OIDC token
# (`id-token: write`) and npm authenticates it against the Trusted Publisher
# registered for this repo and this workflow file, so a leaked secret cannot
# publish. Provenance is recorded in the same step. A trusted publisher is
# configured on a package that already exists, so the very first publish of
# @hzrshz/pi-web-remote stays a human `npm publish`; every version after it is this file.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check the package without publishing
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No `registry-url` here on purpose: setup-node then writes an `_authToken`
      # line into its own userconfig, filled with a `XXXXX-XXXXX-XXXXX-XXXXX`
      # placeholder because no token exists. npm treats that as credentials and
      # sends it instead of exchanging the OIDC token, and the registry answers a
      # write from an unknown token with a plain 404. `publishConfig.registry` in
      # package.json is what pins the publish to npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: What npm is configured to use
        run: |
          set -euo pipefail
          echo "registry: $(npm config get registry)"
          echo "publishConfig: $(node -p "JSON.stringify(require('./package.json').publishConfig)")"
          for f in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc"; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            echo "--- $f ---"
            sed -E 's/(_authToken=)[A-Za-z0-9_-]{26,}/\1[redacted]/' "$f"
          done
      # npm exchanges the OIDC token for a one-time publish token only from 11.5.1;
      # the Node 22 runtime it installs below still ships npm 10.
      - run: npm install --global npm@11
      - run: npm ci
      # The published package ships `.next`: nothing compiles on the machine that
      # installs it, so a build that did not happen has to fail here, not there.
      - run: npm run build
      - name: The version is the tag's
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [ "v${version}" = "${TAG}" ] || {
            echo "tag ${TAG} does not match package.json version v${version}"
            exit 1
          }
      - name: The package carries its build output
        run: |
          set -euo pipefail
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          # A file rather than a pipe: `grep -q` stops reading as soon as it has
          # its answer, and under `pipefail` the writer's broken pipe would fail
          # the step for a package that is actually fine.
          listing="$RUNNER_TEMP/package-contents.txt"
          tar -tzf "$RUNNER_TEMP/$tarball" > "$listing"
          next_files="$(grep -c '^package/\.next/' "$listing" || true)"
          [ "$next_files" -gt 100 ] || {
            echo "$tarball holds only ${next_files} .next files: the build never reached the package"
            exit 1
          }
          for required in package/.next/BUILD_ID package/.next/required-server-files.json package/bin/pi-web.js; do
            grep -qxF "$required" "$listing" || { echo "$required is missing from $tarball"; exit 1; }
          done
          echo "$tarball: $(wc -l < "$listing" | tr -d ' ') files, $(du -h "$RUNNER_TEMP/$tarball" | cut -f1)"
      # npm answers a rejected publish with a bare "404 Not Found", whether the
      # Trusted Publisher record is missing, points at another workflow file, or
      # was given only the stage-publish permission. These are the claims npm
      # matches that record against, so a mismatch is readable here.
      - name: The identity npm presents
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" \
            | node -e '
              const token = JSON.parse(require("fs").readFileSync(0, "utf8")).value;
              const c = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
              for (const k of Object.keys(c).sort())
                if (typeof c[k] !== "object") console.log(k + " = " + c[k]);
            '
      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # The first publish of a new package is always by hand (a trusted publisher
          # needs a package to attach to), so that tag must not fail here.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on the registry: nothing to publish"
            exit 0
          fi
          npm publish --access public --provenance --loglevel http
